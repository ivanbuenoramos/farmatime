name: Android Release (Google Play)

on:
  workflow_dispatch:
    inputs:
      build-number:
        description: "versionCode (dejar vacío para autogenerarlo)"
        required: false
        type: string
      track:
        description: "Track de Play al que subir"
        required: false
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build AAB and upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Install upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          # android/app/build.gradle.kts lee estas claves de android/key.properties
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build AAB
        run: |
          # versionCode único y ascendente: manual si se indica,
          # autogenerado (1000 + nº de ejecución) en el resto de casos.
          BUILD_NUMBER="${{ inputs.build-number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$((1000 + ${{ github.run_number }}))
          fi
          echo "versionCode: $BUILD_NUMBER"
          flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Upload to Google Play
        # OJO: la PRIMERA subida de la app hay que hacerla a mano desde Play
        # Console — la Publishing API no puede crear la ficha inicial.
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: net.farmatime.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          mappingFile: build/app/outputs/mapping/release/mapping.txt

      - name: Upload AAB as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmatime-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Clean up secrets
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/upload-keystore.jks"
